<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Physics Learning System</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: auto;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
}

button {
  background: #22c55e;
  border: none;
  padding: 10px 15px;
  color: black;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}

.hidden {
  display: none;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

</style>
</head>

<body>

<div class="container">

<h1>⚡ AP Physics Trainer</h1>

<div id="lesson"></div>

</div>

<script>

// ==========================
// LESSON DATA (EDIT THIS)
// ==========================

const lessonData = {
  topic: "Newton's Second Law",

  hook: "If you push a shopping cart harder, what changes — speed, mass, or both?",

  tryFirst: {
    question: "A 2 kg object is pushed with a force of 10 N. What is its acceleration?",
    answer: "5 m/s²"
  },

  steps: [
    "Step 1: Known → Force = 10 N, Mass = 2 kg",
    "Step 2: Unknown → Acceleration",
    "Step 3: Equation → F = ma",
    "Step 4: Solve → a = F/m = 10/2 = 5 m/s²"
  ],

  explanation: {
    simple: "Acceleration happens when a force pushes something. More force = more acceleration. More mass = harder to accelerate.",
    formal: "Newton’s Second Law states that force equals mass times acceleration (F = ma)."
  },

  mistakes: [
    "If you got 20 → you multiplied instead of dividing",
    "If you got 0.2 → you flipped the equation wrong",
    "Forgetting units → always include m/s²"
  ],

  guided: [
    {
      q: "Force = 20 N, Mass = 4 kg. Find acceleration.",
      a: "a = 20/4 = 5 m/s²"
    },
    {
      q: "Force = 15 N, Mass = 3 kg. Find acceleration.",
      a: "a = 5 m/s²"
    }
  ],

  independent: [
    "Force = 12 N, Mass = 3 kg → a = ?",
    "Force = 30 N, Mass = 6 kg → a = ?",
    "Force = 8 N, Mass = 2 kg → a = ?"
  ],

  answers: [
    "4 m/s²",
    "5 m/s²",
    "4 m/s²"
  ],

  mixed: [
    "A 2 kg object accelerates at 3 m/s². What force is applied?",
    "A force causes acceleration. What happens if mass doubles?"
  ]

};

// ==========================
// ENGINE
// ==========================

const lessonDiv = document.getElementById("lesson");

let stepIndex = 0;

function renderStep() {

  const section = getSection(stepIndex);

  lessonDiv.innerHTML = section;
}

function nextStep() {
  stepIndex++;
  renderStep();
}

function getSection(i) {

  switch(i) {

    case 0:
      return `
      <div class="card">
        <h2>1. HOOK</h2>
        <p>${lessonData.hook}</p>
        <button onclick="nextStep()">Next</button>
      </div>
      `;

    case 1:
      return `
      <div class="card">
        <h2>2. TRY FIRST</h2>
        <p>${lessonData.tryFirst.question}</p>
        <input placeholder="Your answer...">
        <button onclick="nextStep()">I tried → Continue</button>
      </div>
      `;

    case 2:
      return `
      <div class="card">
        <h2>3. STEP-BY-STEP</h2>
        ${lessonData.steps.map(s => `<p>${s}</p>`).join("")}
        <button onclick="nextStep()">Next</button>
      </div>
      `;

    case 3:
      return `
      <div class="card">
        <h2>4. EXPLANATION</h2>
        <p><strong>Simple:</strong> ${lessonData.explanation.simple}</p>
        <p><strong>Formal:</strong> ${lessonData.explanation.formal}</p>
        <button onclick="nextStep()">Next</button>
      </div>
      `;

    case 4:
      return `
      <div class="card">
        <h2>5. COMMON MISTAKES</h2>
        ${lessonData.mistakes.map(m => `<p>⚠️ ${m}</p>`).join("")}
        <button onclick="nextStep()">Next</button>
      </div>
      `;

    case 5:
      return `
      <div class="card">
        <h2>6. GUIDED PRACTICE</h2>
        ${lessonData.guided.map(g => `
          <p>${g.q}</p>
          <p><strong>${g.a}</strong></p>
        `).join("")}
        <button onclick="nextStep()">Next</button>
      </div>
      `;

    case 6:
      return `
      <div class="card">
        <h2>7. INDEPENDENT PRACTICE</h2>
        ${lessonData.independent.map(q => `<p>${q}</p>`).join("")}
        <button onclick="nextStep()">Show Answers</button>
      </div>
      `;

    case 7:
      return `
      <div class="card">
        <h2>8. FEEDBACK</h2>
        ${lessonData.answers.map(a => `<p>✔ ${a}</p>`).join("")}
        <button onclick="nextStep()">Next</button>
      </div>
      `;

    case 8:
      return `
      <div class="card">
        <h2>9. MIXED REVIEW</h2>
        ${lessonData.mixed.map(q => `<p>${q}</p>`).join("")}
        <button onclick="nextStep()">Next</button>
      </div>
      `;

    case 9:
      return `
      <div class="card">
        <h2>10. TEACH BACK</h2>
        <p>Explain this concept in 1–2 sentences like you're the teacher.</p>
        <input placeholder="Type your explanation...">
        <button onclick="location.reload()">Restart</button>
      </div>
      `;

  }

}

// start
renderStep();

</script>

</body>
</html>
